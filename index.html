<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Side Tee Physics Prototype</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <img class="brand-logo" src="tee-game-logo.svg" alt="Tee Game">
    <div class="hole-nav" aria-label="Hole navigation">
      <button type="button" data-hole-prev aria-label="Previous hole">‹</button>
      <span class="hole-count" data-hole-counter>1/9</span>
      <button type="button" data-hole-next aria-label="Next hole">›</button>
    </div>
    <canvas id="sky" aria-hidden="true"></canvas>
    <canvas id="game" aria-label="Side-on golf physics prototype"></canvas>
    <div class="testing-tools" aria-label="Testing tools">
      <button type="button" data-aspect="auto" class="active">Auto</button>
      <button type="button" data-aspect="phone">Phone</button>
      <button type="button" data-aspect="four-five">4:5</button>
      <button type="button" data-aspect="desktop">Wide</button>
    </div>
    <script src="src/sky-system.js?v=6"></script>
    <script src="src/game.js?v=6"></script>
  </body>
</html>
